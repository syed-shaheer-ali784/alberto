
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBERTO CLOCKS | Sign In</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: #203729;
    background:
        linear-gradient(rgba(245,250,246,.65), rgba(228,241,231,.78)),
        url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5rTBR89jhBKQgGNBiDVpemQzDGHcKw-UFlx6LdEuHJA&s=10");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 18px;
    padding: 22px 7%;
    background: rgba(255,255,255,.85);
    border-bottom: 1px solid #dce9de;
}

.logo {
    color: #244b34;
    text-decoration: none;
    font-weight: bold;
    font-size: 25px;
    letter-spacing: 4px;
}

nav {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
}

nav a {
    text-decoration: none;
    color: #244b34;
    font-size: 12px;
    font-weight: bold;
}

nav a:hover {
    color: #9a8044;
}

main {
    min-height: calc(100vh - 80px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 45px 18px;
}

.login-card {
    width: 100%;
    max-width: 440px;
    padding: 38px;
    background: rgba(255,255,255,.94);
    border: 1px solid #d6e6d9;
    border-radius: 16px;
    box-shadow: 0 25px 70px rgba(25,60,35,.15);
    animation: appear .8s ease both;
}

.brand-mark {
    text-align: center;
    font-size: 12px;
    letter-spacing: 5px;
    color: #7c9b82;
    margin-bottom: 17px;
}

h1 {
    text-align: center;
    font: normal 38px Georgia, serif;
    margin-bottom: 12px;
}

h1 span {
    color: #8caf93;
}

.subtitle {
    text-align: center;
    color: #748176;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 27px;
}

.tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 5px;
    border-radius: 8px;
    background: #eef5ef;
    margin-bottom: 25px;
}

.tab {
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #42624b;
    cursor: pointer;
    font-weight: bold;
}

.tab.active {
    color: white;
    background: #315a3d;
    box-shadow: 0 4px 12px #244b3420;
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: bold;
}

.field input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d4e2d6;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
    background: #fcfefc;
}

.field input:focus {
    border-color: #6d9d77;
    box-shadow: 0 0 0 3px #8caf9325;
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 65px;
}

.show-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #507459;
    font-size: 12px;
    cursor: pointer;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 5px 0 22px;
    font-size: 12px;
}

.remember {
    display: flex;
    gap: 7px;
    align-items: center;
    color: #667568;
}

.remember input {
    accent-color: #315a3d;
}

.options a,
.switch-text a {
    color: #315a3d;
    text-decoration: none;
    font-weight: bold;
}

.submit-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 7px;
    background: #244b34;
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
}

.submit-btn:hover {
    background: #8caf93;
    color: #173c25;
    transform: translateY(-2px);
}

.switch-text {
    margin-top: 22px;
    text-align: center;
    font-size: 13px;
    color: #728075;
}

.message {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border-radius: 7px;
    background: #edf7ee;
    color: #244b34;
    font-size: 13px;
    line-height: 1.6;
}

.security-note {
    margin-top: 24px;
    text-align: center;
    color: #829084;
    font-size: 11px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(22px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 550px) {
    header {
        justify-content: center;
    }

    nav {
        justify-content: center;
        gap: 14px;
    }

    .login-card {
        padding: 26px 20px;
    }

    h1 {
        font-size: 33px;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">ALBERTO</a>

    <nav>
        <a href="index.html">HOME</a>
        <a href="allcollection.html">COLLECTION</a>
        <a href="about.html">ABOUT</a>
        <a href="card.html">CART 🛒</a>
    </nav>
</header>

<main>
    <section class="login-card">

        <div class="brand-mark">ALBERTO CLOCKS</div>

        <h1 id="heading">Welcome <span>Back.</span></h1>

        <p class="subtitle" id="subtitle">
            Sign in to continue your luxury experience.
        </p>

        <div class="tabs">
            <button class="tab active" id="signinTab" type="button"
                    onclick="setMode('signin')">SIGN IN</button>
            <button class="tab" id="signupTab" type="button"
                    onclick="setMode('signup')">CREATE ACCOUNT</button>
        </div>

        <form id="loginForm">
            <div class="field" id="nameField" hidden>
                <label for="fullName">Full Name</label>
                <input id="fullName" name="fullName"
                       autocomplete="name" placeholder="Enter your full name">
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email"
                       autocomplete="email" required
                       placeholder="you@example.com">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" minlength="6"
                           required placeholder="Enter your password">
                    <button type="button" class="show-password"
                            onclick="togglePassword()">SHOW</button>
                </div>
            </div>

            <div class="options" id="loginOptions">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="#" onclick="forgotPassword(event)">
                    Forgot password?
                </a>
            </div>

            <button class="submit-btn" type="submit" id="submitButton">
                SIGN IN →
            </button>

            <div class="message" id="message" role="status"></div>
        </form>

        <p class="switch-text" id="switchText">
            New to ALBERTO?
            <a href="#" onclick="setMode('signup'); return false;">
                Create an account
            </a>
        </p>

        <p class="security-note">
            TIMELESS STYLE · PERSONAL EXPERIENCE
        </p>

    </section>
</main>

<script>
let mode = "signin";

function setMode(newMode) {
    mode = newMode;

    const signup = mode === "signup";
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("fullName");
    const password = document.getElementById("password");
    const message = document.getElementById("message");

    nameField.hidden = !signup;
    nameInput.required = signup;

    password.autocomplete = signup
        ? "new-password"
        : "current-password";

    document.getElementById("heading").innerHTML = signup
        ? 'Create Your <span>Account.</span>'
        : 'Welcome <span>Back.</span>';

    document.getElementById("subtitle").textContent = signup
        ? "Join ALBERTO CLOCKS and discover timeless elegance."
        : "Sign in to continue your luxury experience.";

    document.getElementById("signinTab").classList.toggle("active", !signup);
    document.getElementById("signupTab").classList.toggle("active", signup);

    document.getElementById("loginOptions").style.display =
        signup ? "none" : "flex";

    document.getElementById("submitButton").textContent =
        signup ? "CREATE ACCOUNT →" : "SIGN IN →";

    document.getElementById("switchText").innerHTML = signup
        ? 'Already have an account? <a href="#" onclick="setMode(\'signin\'); return false;">Sign in</a>'
        : 'New to ALBERTO? <a href="#" onclick="setMode(\'signup\'); return false;">Create an account</a>';

    message.style.display = "none";
}

function togglePassword() {
    const input = document.getElementById("password");
    const button = document.querySelector(".show-password");

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "HIDE";
    } else {
        input.type = "password";
        button.textContent = "SHOW";
    }
}

function forgotPassword(event) {
    event.preventDefault();

    const message = document.getElementById("message");
    message.textContent =
        "Password reset is not connected yet. A secure account service is needed to reset passwords.";
    message.style.display = "block";
}

document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const message = document.getElementById("message");

    if (mode === "signup") {
        message.textContent =
            "The sign-up design is ready, but account creation needs a secure backend or authentication service. No account has been created.";
    } else {
        message.textContent =
            "The sign-in design is ready, but login verification is not connected yet. No account has been signed in.";
    }

    message.style.display = "block";
});
</script>

</body>
</html>
